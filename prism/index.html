<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism Field</title>
<meta name="description" content="Gerador de campo de luz prismática animada em WebGL2, com controlos para pregas, refração, brilho e bandas espectrais.">
<link rel="stylesheet" href="style.css">
</head>
<body class="panel-open">
<main id="stage">
  <canvas id="c" aria-label="Campo de luz prismática animada"></canvas>
  <p id="nogl" hidden>Este navegador não suporta WebGL2.</p>
</main>

<button id="reveal" type="button" aria-label="Mostrar painel">Controlos</button>

<aside id="panel" aria-label="Controlos">
  <header>
    <h1>Prism Field</h1>
    <div class="hdr-btns">
      <button id="btnPause" type="button" title="Pausar / retomar (espaço)">Pausa</button>
      <button id="btnHide" type="button" title="Esconder painel (H)">Esconder</button>
    </div>
  </header>
  <div class="top-actions">
    <label class="preset">Preset
      <select id="presetSel"></select>
    </label>
    <div class="btn-row">
      <button id="btnRandom" type="button" title="Aleatório (R)">Aleatório</button>
      <button id="btnRandPal" type="button">Só cores</button>
      <button id="btnReset" type="button">Repor</button>
    </div>
  </div>
  <div id="sections"></div>
  <footer>
    <div class="btn-row">
      <button id="btnPng" type="button">Exportar PNG</button>
      <button id="btnRec" type="button">Gravar vídeo</button>
    </div>
    <div class="btn-row">
      <button id="btnCopy" type="button">Copiar definições</button>
      <button id="btnPaste" type="button">Colar definições</button>
      <button id="btnFs" type="button" title="Ecrã inteiro (F)">Ecrã inteiro</button>
    </div>
    <p class="hint">Espaço pausa · R aleatório · H esconde o painel · F ecrã inteiro · duplo clique numa etiqueta repõe o valor</p>
    <p id="status" role="status"></p>
  </footer>
</aside>
<script src="app.js"></script>
</body>
</html>
